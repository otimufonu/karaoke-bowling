<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>カラオケボウリング｜極・条件スロット</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  width: 100vw;
  height: 100dvh;
  background: #08030c;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* モーダル起動用ボタン */
.open-modal-btn {
  padding: 18px 36px;
  font-size: 20px;
  font-weight: 900;
  color: #000;
  background: linear-gradient(135deg, #ffe066 0%, #f5af19 50%, #e65c00 100%);
  border: 2px solid #fff;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(245, 175, 25, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.8);
  letter-spacing: 2px;
  transition: transform 0.2s, box-shadow 0.2s;
}

.open-modal-btn:active {
  transform: scale(0.95);
}

/* モーダル背景（オーバーレイ） */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100dvh;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  z-index: 1000;
  padding: 12px;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* モーダル本体（iPhone XR画面比率 100dvh 追従・スクロールなし） */
.modal-content {
  position: relative;
  width: min(414px, 100%);
  height: min(850px, 96dvh);
  background: radial-gradient(circle at center, #1f0a2e 0%, #0a0212 100%);
  border: 3px solid #ffcc00;
  border-radius: 28px;
  padding: 20px 16px 16px;
  box-shadow: 0 0 35px rgba(255, 204, 0, 0.3), inset 0 0 15px rgba(255, 0, 128, 0.2);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  transform: scale(0.9);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  overflow: hidden;
}

.modal-overlay.active .modal-content {
  transform: scale(1);
}

/* 閉じるボタン (×) */
.close-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid #ffcc00;
  color: #ffcc00;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

/* タイトルエリア */
.header-area {
  text-align: center;
  width: 100%;
}

.sub-title {
  font-size: 11px;
  font-weight: 800;
  color: #ff007f;
  letter-spacing: 3px;
  text-shadow: 0 0 8px #ff007f;
}

h1 {
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(180deg, #fff 0%, #ffe600 50%, #ff8800 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 10px rgba(255, 230, 0, 0.5);
  letter-spacing: 1px;
  margin-top: 2px;
}

/* ----------------------------------
   スロットマシーン枠＆リール演出
---------------------------------- */
.slot-container {
  width: 100%;
  flex: 1;
  max-height: 300px;
  margin: 12px 0;
  background: #000;
  border: 4px solid #ffcc00;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(255, 204, 0, 0.4), inset 0 0 20px rgba(0,0,0,0.9);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 上下の立体グラデーションシャドウ（ドラム感を出す） */
.slot-container::before,
.slot-container::after {
  content: "";
  position: absolute;
  left: 0;
  width: 100%;
  height: 38%;
  z-index: 5;
  pointer-events: none;
}
.slot-container::before {
  top: 0;
  background: linear-gradient(to bottom, rgba(10, 2, 18, 0.95) 0%, rgba(10, 2, 18, 0) 100%);
}
.slot-container::after {
  bottom: 0;
  background: linear-gradient(to top, rgba(10, 2, 18, 0.95) 0%, rgba(10, 2, 18, 0) 100%);
}

/* 中央配当ライン（ペイライン） */
.payline {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 90px;
  transform: translateY(-50%);
  border-top: 2px solid #ff0055;
  border-bottom: 2px solid #ff0055;
  background: rgba(255, 0, 85, 0.08);
  box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
  z-index: 4;
  pointer-events: none;
}

/* リール本体 */
.reel-viewport {
  width: 100%;
  height: 90px;
  overflow: hidden;
  position: relative;
}

.reel-strip {
  position: absolute;
  width: 100%;
  top: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  transition: transform 0.05s linear;
}

.reel-item {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  text-align: center;
  font-size: 22px;
  font-weight: 900;
  color: #ffffff;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 0, 128, 0.8);
  line-height: 1.25;
  word-break: break-all;
}

/* ブラー（高速回転用） */
.spinning .reel-strip {
  filter: blur(2px);
}

/* 当選フラッシュ演出 */
@keyframes winGlow {
  0%, 100% { border-color: #ffcc00; box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
  50% { border-color: #ff0055; box-shadow: 0 0 40px #ff0055, inset 0 0 25px #ff0055; }
}

.slot-container.win-flash {
  animation: winGlow 0.3s ease-in-out infinite;
}

/* ----------------------------------
   SPIN ボタン（大粒・キラキラ）
---------------------------------- */
.spin-btn {
  width: 100%;
  height: 64px;
  border: none;
  border-radius: 32px;
  background: linear-gradient(180deg, #ff3300 0%, #ff0055 50%, #990033 100%);
  color: #fff;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 6px 0 #660022, 0 10px 20px rgba(255, 0, 85, 0.6);
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
  position: relative;
  overflow: hidden;
  transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
}

.spin-btn::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(60deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%);
  transform: rotate(30deg);
  animation: shine 2.5s infinite;
}

@keyframes shine {
  0% { transform: translateX(-100%) rotate(30deg); }
  100% { transform: translateX(100%) rotate(30deg); }
}

.spin-btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #660022, 0 4px 10px rgba(255, 0, 85, 0.6);
}

.spin-btn:disabled {
  filter: grayscale(0.7) opacity(0.6);
  cursor: not-allowed;
  box-shadow: none;
}

/* 下部サブエリア & 履歴 */
.bottom-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
}

.edit-link-btn {
  width: 100%;
  padding: 10px;
  border: 1px solid rgba(255, 204, 0, 0.4);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  color: #ffcc00;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  display: block;
}

.history-card {
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 8px 12px;
  height: 90px;
  display: flex;
  flex-direction: column;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: #aaa;
  margin-bottom: 4px;
}

.reset-btn {
  background: none;
  border: none;
  color: #ff4444;
  font-size: 11px;
  cursor: pointer;
  text-decoration: underline;
}

.history-list {
  flex: 1;
  overflow-y: auto;
  font-size: 12px;
  color: #ddd;
}

.history-item {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px dotted rgba(255,255,255,0.1);
}

.history-item:last-child {
  border-bottom: none;
}
</style>
</head>

<body>

<!-- モーダル起動用ボタン -->
<button id="openModalBtn" class="open-modal-btn">スロットを開く</button>

<!-- モーダルオーバーレイ -->
<div id="modalOverlay" class="modal-overlay">

  <!-- モーダル本体 -->
  <div class="modal-content">

    <!-- 閉じるボタン (×) -->
    <button id="closeModalBtn" class="close-btn" aria-label="閉じる">&times;</button>

    <!-- ヘッダー -->
    <div class="header-area">
      <div class="sub-title">KARAOKE BOWLING</div>
      <h1>条件ルーレット</h1>
    </div>

    <!-- スロットディスプレイ -->
    <div id="slotContainer" class="slot-container">
      <div class="payline"></div>
      <div class="reel-viewport">
        <div id="reelStrip" class="reel-strip">
          <div class="reel-item">READY?</div>
        </div>
      </div>
    </div>

    <!-- SPINボタン -->
    <button id="spinBtn" class="spin-btn">SPIN!</button>

    <!-- 下部エリア（編集リンク & 履歴） -->
    <div class="bottom-area">
      <a href="conditions.html" class="edit-link-btn">⚙️ 条件項目を編集する</a>

      <div class="history-card">
        <div class="history-header">
          <span>HISTORIES (最新3件)</span>
          <button id="resetHistoryBtn" class="reset-btn">削除</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </div>
    </div>

  </div>

</div>

<script>
const STORAGE_KEY = "karaokeBowlingConditions_v1";

// ============================================================
// 初期条件データ (互換性維持のためeasy/hard保持)
// ============================================================
const defaultConditions = {
  easy: [{ category: "その他", text: "自由！", multiplier: 1.0 }],
  hard: [
    { category: "アーティスト", text: "男性ボーカルの曲", multiplier: 1.0 },
    { category: "アーティスト", text: "女性ボーカルの曲", multiplier: 1.0 },
    { category: "アーティスト", text: "あ行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "か行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "さ行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "た行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "な行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "は行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "ま行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "や行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "ら行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "わ行から始まるアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "アーティスト名が漢字から始まる", multiplier: 1.0 },
    { category: "アーティスト", text: "アーティスト名がカタカナから始まる", multiplier: 1.0 },
    { category: "アーティスト", text: "アーティスト名がひらがなから始まる", multiplier: 1.0 },
    { category: "アーティスト", text: "アーティスト名がアルファベットから始まる", multiplier: 1.0 },
    { category: "アーティスト", text: "アーティスト名が5文字以上", multiplier: 1.0 },
    { category: "アーティスト", text: "ソロアーティスト", multiplier: 1.0 },
    { category: "アーティスト", text: "男女混成グループ", multiplier: 1.0 },
    { category: "アーティスト", text: "バンドの曲", multiplier: 1.0 },
    { category: "曲名", text: "あ行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "か行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "さ行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "た行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "な行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "は行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "ま行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "や行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "ら行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "わ行から始まる曲名", multiplier: 1.0 },
    { category: "曲名", text: "曲名が漢字のみ", multiplier: 1.0 },
    { category: "曲名", text: "曲名がひらがなのみ", multiplier: 1.0 },
    { category: "曲名", text: "曲名がカタカナのみ", multiplier: 1.0 },
    { category: "曲名", text: "曲名がアルファベットのみ", multiplier: 1.0 },
    { category: "曲名", text: "曲名に数字を含む", multiplier: 1.0 },
    { category: "曲名", text: "曲名が5文字以上", multiplier: 1.0 },
    { category: "曲名", text: "曲名が5文字以下", multiplier: 1.0 },
    { category: "年代", text: "2000年代以前の曲", multiplier: 1.0 },
    { category: "年代", text: "2010年代以降の曲", multiplier: 1.0 },
    { category: "年代", text: "昭和の曲", multiplier: 1.0 },
    { category: "年代", text: "平成の曲", multiplier: 1.0 },
    { category: "年代", text: "令和の曲", multiplier: 1.0 },
    { category: "タイアップ", text: "アニメの曲", multiplier: 1.0 },
    { category: "タイアップ", text: "ドラマ・映画の曲", multiplier: 1.0 },
    { category: "タイアップ", text: "CMソング", multiplier: 1.0 },
    { category: "歌詞", text: "歌詞に食べ物が出てくる", multiplier: 1.0 },
    { category: "歌詞", text: "歌詞に地名が出てくる", multiplier: 1.0 }
  ]
};

// モーダル制御
const openModalBtn = document.getElementById("openModalBtn");
const closeModalBtn = document.getElementById("closeModalBtn");
const modalOverlay = document.getElementById("modalOverlay");

function openModal() {
  modalOverlay.classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  modalOverlay.classList.remove("active");
  document.body.style.overflow = "";
}

openModalBtn.addEventListener("click", openModal);
closeModalBtn.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modalOverlay.classList.contains("active")) closeModal(); });

// データ読み込み（hardおよびeasy統合の全条件を抽出）
function loadConditions() {
  const saved = localStorage.getItem(STORAGE_KEY);
  let data = defaultConditions;
  if (saved) {
    try { data = JSON.parse(saved); } catch (e) { console.error(e); }
  } else {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultConditions));
  }
  
  // easyとhardを結合して全条件を取得（重複を避けるかそのまま使用）
  const allList = [...(data.hard || []), ...(data.easy || [])];
  return allList.length > 0 ? allList : defaultConditions.hard;
}

let conditions = loadConditions();
let spinning = false;

const slotContainer = document.getElementById("slotContainer");
const reelStrip = document.getElementById("reelStrip");
const spinBtn = document.getElementById("spinBtn");

const ITEM_HEIGHT = 90; // リール項目の高さ(px)

// ============================================================
// 縦回転スロット アニメーション処理
// ============================================================
function spinSlot() {
  if (spinning) return;
  
  conditions = loadConditions();
  if (!conditions || conditions.length === 0) return;

  spinning = true;
  spinBtn.disabled = true;
  slotContainer.classList.remove("win-flash");
  slotContainer.classList.add("spinning");

  // 当選アイテムを決定
  const selectedIndex = Math.floor(Math.random() * conditions.length);
  const selectedItem = conditions[selectedIndex];

  // スロットリール用ダミー配列構築（30回転分ランダムに敷き詰める）
  const totalSteps = 35; // 回転数
  const stripItems = [];

  for (let i = 0; i < totalSteps; i++) {
    const randomCond = conditions[Math.floor(Math.random() * conditions.length)];
    stripItems.push(randomCond.text);
  }
  // 最後に当選項目をセット
  stripItems.push(selectedItem.text);

  // リールDOM要素作成
  reelStrip.innerHTML = "";
  stripItems.forEach(text => {
    const div = document.createElement("div");
    div.className = "reel-item";
    div.textContent = text;
    reelStrip.appendChild(div);
  });

  // 初期位置リセット
  reelStrip.style.transition = "none";
  reelStrip.style.transform = `translateY(0px)`;

  // イージング付き高速縦回転アニメーション
  const totalDistance = totalSteps * ITEM_HEIGHT;
  const duration = 2800; // 回転時間 (ms)
  const startTime = performance.now();

  function animate(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);

    // easeOutQuart（後半一気に減速する慣性演出）
    const easeProgress = 1 - Math.pow(1 - progress, 4);
    const currentY = easeProgress * totalDistance;

    reelStrip.style.transform = `translateY(-${currentY}px)`;

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      finishSpin(selectedItem);
    }
  }

  // 微小ディレイ後にアニメーション開始
  setTimeout(() => {
    requestAnimationFrame(animate);
  }, 50);
}

// 停止バウンド＆当選フラッシュ処理
function finishSpin(selectedItem) {
  slotContainer.classList.remove("spinning");
  
  // ピタッと止まった時のバウンド演出 (CSS transition)
  const finalDistance = (reelStrip.children.length - 1) * ITEM_HEIGHT;
  reelStrip.style.transition = "transform 0.25s cubic-bezier(0.175, 0.885, 0.45, 1.3)";
  reelStrip.style.transform = `translateY(-${finalDistance}px)`;

  setTimeout(() => {
    // 当選フラッシュ開始
    slotContainer.classList.add("win-flash");
    addHistory(selectedItem);
    spinning = false;
    spinBtn.disabled = false;
  }, 250);
}

// ============================================================
// 履歴機能（直近3件のみシンプルに保持）
// ============================================================
function addHistory(condition) {
  const history = JSON.parse(localStorage.getItem("karaokeBowlingHistory") || "[]");
  history.unshift({
    text: condition.text,
    category: condition.category || "条件",
    time: new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
  });

  localStorage.setItem("karaokeBowlingHistory", JSON.stringify(history.slice(0, 10)));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem("karaokeBowlingHistory") || "[]");
  const historyList = document.getElementById("historyList");
  historyList.innerHTML = "";

  if (history.length === 0) {
    historyList.innerHTML = `<div style="color:#666; text-align:center; padding-top:10px;">履歴はありません</div>`;
    return;
  }

  // 画面の圧迫を防ぐため直近3件を表示
  history.slice(0, 3).forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `
      <span style="font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:230px;">
        ${escapeHtml(item.text)}
      </span>
      <span style="color:#888; font-size:10px;">${item.time}</span>
    `;
    historyList.appendChild(div);
  });
}

document.getElementById("resetHistoryBtn").addEventListener("click", () => {
  if (confirm("履歴を削除しますか？")) {
    localStorage.removeItem("karaokeBowlingHistory");
    renderHistory();
  }
});

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

spinBtn.addEventListener("click", spinSlot);
renderHistory();
</script>

</body>
</html>
