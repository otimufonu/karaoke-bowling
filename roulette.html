<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケボウリング｜条件ルーレット</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px 20px;
  background: #111;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* モーダル起動用ボタン */
.open-modal-btn {
  padding: 16px 32px;
  font-size: 18px;
  font-weight: bold;
  color: #111;
  background: #fff;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
  transition: transform 0.2s, box-shadow 0.2s;
}

.open-modal-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
}

/* モーダル背景（オーバーレイ） */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  z-index: 1000;
  padding: 16px;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* モーダル本体 */
.modal-content {
  position: relative;
  width: min(600px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #181818;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  transform: scale(0.92);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal-content {
  transform: scale(1);
}

/* 閉じるボタン (×) */
.close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #2a2a2a;
  border: none;
  color: #aaa;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s;
  z-index: 10;
}

.close-btn:hover {
  background: #444;
  color: #fff;
}

h1 {
  text-align: center;
  font-size: 22px;
  margin: 5px 0 20px;
  padding-right: 20px;
}

.mode {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.mode button {
  flex: 1;
  padding: 12px;
  border: 1px solid #555;
  border-radius: 10px;
  background: #222;
  color: #aaa;
  font-size: 15px;
  font-weight: bold;
}

.mode button.active {
  background: #fff;
  color: #111;
}

.roulette {
  min-height: 170px;
  border: 2px solid #444;
  border-radius: 16px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  margin-bottom: 18px;
}

.condition {
  font-size: clamp(20px, 5vw, 36px);
  font-weight: bold;
  line-height: 1.35;
}

button {
  cursor: pointer;
}

.spin {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 18px;
  font-weight: bold;
}

.spin:disabled {
  opacity: .4;
  cursor: default;
}

.info {
  margin-top: 18px;
  padding: 14px;
  background: #222;
  border-radius: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.infoBox {
  text-align: center;
  background: #181818;
  border-radius: 10px;
  padding: 10px;
}

.infoLabel {
  font-size: 11px;
  color: #999;
}

.infoValue {
  margin-top: 4px;
  font-size: 20px;
  font-weight: bold;
}

.inputs {
  margin-top: 18px;
}

.inputs label {
  display: block;
  margin-bottom: 6px;
  color: #aaa;
  font-size: 12px;
}

.inputs input {
  width: 100%;
  padding: 11px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #222;
  color: #fff;
  font-size: 15px;
  margin-bottom: 10px;
}

.subButtons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.subButtons button {
  flex: 1;
  padding: 10px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #222;
  color: #ccc;
  font-size: 13px;
}

.history {
  margin-top: 20px;
}

.history h2 {
  font-size: 16px;
  margin-bottom: 10px;
}

.historyItem {
  padding: 10px 12px;
  background: #222;
  border-radius: 8px;
  margin-bottom: 7px;
  font-size: 13px;
}

.historyMeta {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

a {
  color: inherit;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- モーダル起動用ボタン -->
<button id="openModalBtn" class="open-modal-btn">条件ルーレットを開く</button>

<!-- モーダルオーバーレイ -->
<div id="modalOverlay" class="modal-overlay">

  <!-- モーダルコンテンツ -->
  <div class="modal-content">

    <h1>カラオケボウリング<br>条件ルーレット</h1>

    <div class="mode">
      <button id="easyBtn" class="active">EASY</button>

    </div>

    </div>

    <div class="inputs">

      <label for="previousSong">
        前の人の曲名
      </label>
      <input
        id="previousSong"
        type="text"
        placeholder="しりとり条件で使用"
      >

      <label for="previousArtist">

      </label>
      <input
        id="previousArtist"
        type="text"

    </div>

    <div class="subButtons">
      <a href="conditions.html" style="flex:1;">
        <button style="width:100%;">条件を編集</button>
      </a>
    </div>

    <div class="history">
      <h2>履歴</h2>
      <div id="historyList"></div>

      <button
        id="resetHistoryBtn"
        style="
          width:100%;
          margin-top:10px;
          padding:10px;
          border:1px solid #444;
          border-radius:8px;
          background:#222;
          color:#aaa;
        "

        履歴をリセット

    </div>

</div>

// ============================================================
// モーダル制御
// ============================================================

const openModalBtn = document.getElementById("openModalBtn");
const closeModalBtn = document.getElementById("closeModalBtn");
const modalOverlay = document.getElementById("modalOverlay");

function openModal() {
  modalOverlay.classList.add("active");
  document.body.style.overflow = "hidden"; // 背面のスクロールを禁止
}

function closeModal() {
  modalOverlay.classList.remove("active");
  document.body.style.overflow = ""; // スクロール解除
}

openModalBtn.addEventListener("click", openModal);
closeModalBtn.addEventListener("click", closeModal);

// 背景領域のクリックで閉じる
modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) {
    closeModal();
  }
});

// ESCキーで閉じる
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalOverlay.classList.contains("active")) {
    closeModal();
  }
});


// ============================================================
// データ読み込み
// ============================================================

function loadConditions() {

  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(defaultConditions)
    );

    return structuredClone(defaultConditions);

  }

  try {

    return JSON.parse(saved);

  } catch (e) {

    console.error("条件データ読み込みエラー", e);

    return structuredClone(defaultConditions);

  }

}

// 初期化
// ============================================================

let currentMode = "easy";
let spinning = false;

const conditionEl = document.getElementById("condition");
const difficultyEl = document.getElementById("difficulty");
const multiplierEl = document.getElementById("multiplier");
const spinBtn = document.getElementById("spinBtn");


// ============================================================
// モード切替
// ============================================================

document.getElementById("easyBtn").addEventListener(
  "click",
  () => {

    if (spinning) return;

    currentMode = "easy";

    document
      .getElementById("easyBtn")
      .classList.add("active");

    document
      .getElementById("hardBtn")
      .classList.remove("active");

    difficultyEl.textContent = "EASY";

  }
);


document.getElementById("hardBtn").addEventListener(
  "click",
  () => {

    if (spinning) return;

    currentMode = "hard";

    document
      .getElementById("hardBtn")
      .classList.add("active");

    document
      .getElementById("easyBtn")
      .classList.remove("active");

    difficultyEl.textContent = "HARD";

  }
);


// ============================================================
// ルーレット
// ============================================================

function spinRoulette() {

  if (spinning) return;

  const list = conditions[currentMode];

  if (!list || list.length === 0) {

    conditionEl.textContent =
      "条件がありません";

    return;

  }

  spinning = true;

  spinBtn.disabled = true;

  let count = 0;

  const maxCount = 22;

  function tick() {

    const random =
      list[Math.floor(Math.random() * list.length)];

    conditionEl.textContent = random.text;

    count++;

    if (count >= maxCount) {

      finishRoulette();

      return;

    }

    const progress = count / maxCount;

    const delay =
      45 + Math.pow(progress, 3) * 260;

    setTimeout(tick, delay);

  }

  tick();

}


// ============================================================
// 決定
// ============================================================

function finishRoulette() {

  const list = conditions[currentMode];

  const selected =
    list[Math.floor(Math.random() * list.length)];

  conditionEl.textContent = selected.text;

  multiplierEl.textContent =
    "×" + Number(selected.multiplier).toFixed(1);

  addHistory(
    selected,
    currentMode
  );

  spinning = false;

  spinBtn.disabled = false;

}


// ============================================================
// 履歴
// ============================================================

function addHistory(condition, mode) {

  const history =
    JSON.parse(
      localStorage.getItem("karaokeBowlingHistory") || "[]"
    );

  history.unshift({

    text: condition.text,

    multiplier: condition.multiplier,

    mode: mode,

    category: condition.category,

    time: new Date().toLocaleTimeString(
      "ja-JP",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    )

  });

  localStorage.setItem(
    "karaokeBowlingHistory",
    JSON.stringify(history)
  );

  renderHistory();

}


function renderHistory() {

  const list =
    JSON.parse(
      localStorage.getItem("karaokeBowlingHistory") || "[]"
    );

  const historyList =
    document.getElementById("historyList");

  historyList.innerHTML = "";

  list.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "historyItem";

    div.innerHTML = `

      <div>
        ${escapeHtml(item.text)}
        ×${Number(item.multiplier).toFixed(1)}
      </div>

      <div class="historyMeta">
        ${item.mode.toUpperCase()}
        ／
        ${escapeHtml(item.category || "")}
        ／
        ${item.time}
      </div>

    `;

    historyList.appendChild(div);

  });

}


document
  .getElementById("resetHistoryBtn")
  .addEventListener(
    "click",
    () => {

      if (
        confirm("履歴をすべて削除しますか？")
      ) {

        localStorage.removeItem(
          "karaokeBowlingHistory"
        );

        renderHistory();

      }

    }
  );


// ============================================================
// HTMLエスケープ
// ============================================================

function escapeHtml(str) {

  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


// ============================================================
// 起動
// ============================================================

spinBtn.addEventListener(
  "click",
  spinRoulette
);

renderHistory();
