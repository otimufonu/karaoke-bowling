<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケボウリング｜条件ルーレット</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

.container {
  width: min(700px, 94%);
  margin: 0 auto;
  padding: 24px 0 50px;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 10px 0 24px;
}

.mode {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.mode button {
  flex: 1;
  padding: 14px;
  border: 1px solid #555;
  border-radius: 10px;
  background: #222;
  color: #aaa;
  font-size: 16px;
  font-weight: bold;
}

.mode button.active {
  background: #fff;
  color: #111;
}

.roulette {
  min-height: 190px;
  border: 2px solid #444;
  border-radius: 18px;
  background: #181818;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  margin-bottom: 18px;
}

.condition {
  font-size: clamp(24px, 6vw, 42px);
  font-weight: bold;
  line-height: 1.35;
}

button {
  cursor: pointer;
}

.spin {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 20px;
  font-weight: bold;
}

.spin:disabled {
  opacity: .4;
  cursor: default;
}

.info {
  margin-top: 18px;
  padding: 16px;
  background: #1b1b1b;
  border-radius: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.infoBox {
  text-align: center;
  background: #242424;
  border-radius: 10px;
  padding: 12px;
}

.infoLabel {
  font-size: 12px;
  color: #999;
}

.infoValue {
  margin-top: 5px;
  font-size: 22px;
  font-weight: bold;
}

.inputs {
  margin-top: 20px;
}

.inputs label {
  display: block;
  margin-bottom: 6px;
  color: #aaa;
  font-size: 13px;
}

.inputs input {
  width: 100%;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #1c1c1c;
  color: #fff;
  font-size: 16px;
  margin-bottom: 12px;
}

.history {
  margin-top: 24px;
}

.history h2 {
  font-size: 17px;
  margin-bottom: 10px;
}

.historyItem {
  padding: 10px 12px;
  background: #1b1b1b;
  border-radius: 8px;
  margin-bottom: 7px;
  font-size: 14px;
}

.historyMeta {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

.subButtons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.subButtons button {
  flex: 1;
  padding: 11px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #222;
  color: #ccc;
}

a {
  color: inherit;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <h1>カラオケボウリング<br>条件ルーレット</h1>

  <div class="mode">
    <button id="easyBtn" class="active">EASY</button>
    <button id="hardBtn">HARD</button>
  </div>

  <div class="roulette">
    <div id="condition" class="condition">READY?</div>
  </div>

  <button id="spinBtn" class="spin">ルーレットを回す</button>

  <div class="info">
    <div class="infoBox">
      <div class="infoLabel">難易度</div>
      <div id="difficulty" class="infoValue">EASY</div>
    </div>

    <div class="infoBox">
      <div class="infoLabel">倍率</div>
      <div id="multiplier" class="infoValue">×1.0</div>
    </div>
  </div>

  <div class="inputs">

    <label for="previousSong">
      前の人の曲名
    </label>
    <input
      id="previousSong"
      type="text"
      placeholder="しりとり条件で使用"
    >

    <label for="previousArtist">
      前の人のアーティスト名
    </label>
    <input
      id="previousArtist"
      type="text"
      placeholder="アーティストしりとり条件で使用"
    >

  </div>

  <div class="subButtons">
    <a href="conditions.html" style="flex:1;">
      <button style="width:100%;">条件を編集</button>
    </a>
  </div>

  <div class="history">
    <h2>履歴</h2>
    <div id="historyList"></div>

    <button
      id="resetHistoryBtn"
      style="
        width:100%;
        margin-top:10px;
        padding:10px;
        border:1px solid #444;
        border-radius:8px;
        background:#222;
        color:#aaa;
      "

</div>

// ============================================================
// データ読み込み
// ============================================================

function loadConditions() {

  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(defaultConditions)
    );

    return structuredClone(defaultConditions);

  }

  try {

    return JSON.parse(saved);

  } catch (e) {

    console.error("条件データ読み込みエラー", e);

    return structuredClone(defaultConditions);

  }

}


// ============================================================
// 初期化
// ============================================================

let conditions = loadConditions();

let currentMode = "easy";
let spinning = false;

const conditionEl = document.getElementById("condition");
const difficultyEl = document.getElementById("difficulty");
const multiplierEl = document.getElementById("multiplier");
const spinBtn = document.getElementById("spinBtn");


// ============================================================
// モード切替
// ============================================================

document.getElementById("easyBtn").addEventListener(
  "click",
  () => {

    if (spinning) return;

    currentMode = "easy";

    document
      .getElementById("easyBtn")
      .classList.add("active");

    document
      .getElementById("hardBtn")
      .classList.remove("active");

    difficultyEl.textContent = "EASY";

  }
);


document.getElementById("hardBtn").addEventListener(
  "click",
  () => {

    if (spinning) return;

    currentMode = "hard";

    document
      .getElementById("hardBtn")
      .classList.add("active");

    document
      .getElementById("easyBtn")
      .classList.remove("active");

    difficultyEl.textContent = "HARD";

  }
);


// ============================================================
// ルーレット
// ============================================================

function spinRoulette() {

  if (spinning) return;

  const list = conditions[currentMode];

  if (!list || list.length === 0) {

    conditionEl.textContent =
      "条件がありません";

    return;

  }

  spinning = true;

  spinBtn.disabled = true;

  let count = 0;

  const maxCount = 22;

  function tick() {

    const random =
      list[Math.floor(Math.random() * list.length)];

    conditionEl.textContent = random.text;

    count++;

    if (count >= maxCount) {

      finishRoulette();

      return;

    }

    const progress = count / maxCount;

    const delay =
      45 + Math.pow(progress, 3) * 260;

    setTimeout(tick, delay);

  }

  tick();

}


// ============================================================
// 決定
// ============================================================

function finishRoulette() {

  const list = conditions[currentMode];

  const selected =
    list[Math.floor(Math.random() * list.length)];

  conditionEl.textContent = selected.text;

  multiplierEl.textContent =
    "×" + Number(selected.multiplier).toFixed(1);

  addHistory(
    selected,
    currentMode
  );

  spinning = false;

  spinBtn.disabled = false;

}


// ============================================================
// 履歴
// ============================================================

function addHistory(condition, mode) {

  const history =
    JSON.parse(
      localStorage.getItem("karaokeBowlingHistory") || "[]"
    );

  history.unshift({

    text: condition.text,

    multiplier: condition.multiplier,

    mode: mode,

    category: condition.category,

    time: new Date().toLocaleTimeString(
      "ja-JP",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    )

  });

  localStorage.setItem(
    "karaokeBowlingHistory",
    JSON.stringify(history)
  );

  renderHistory();

}


function renderHistory() {

  const list =
    JSON.parse(
      localStorage.getItem("karaokeBowlingHistory") || "[]"
    );

  const historyList =
    document.getElementById("historyList");

  historyList.innerHTML = "";

  list.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "historyItem";

    div.innerHTML = `

      <div>
        ${escapeHtml(item.text)}
        ×${Number(item.multiplier).toFixed(1)}
      </div>

      <div class="historyMeta">
        ${item.mode.toUpperCase()}
        ／
        ${escapeHtml(item.category || "")}
        ／
        ${item.time}
      </div>

    `;

    historyList.appendChild(div);

  });

}


document
  .getElementById("resetHistoryBtn")
  .addEventListener(
    "click",
    () => {

      if (
        confirm("履歴をすべて削除しますか？")
      ) {

        localStorage.removeItem(
          "karaokeBowlingHistory"
        );

        renderHistory();

      }

    }
  );


// ============================================================
// HTMLエスケープ
// ============================================================

function escapeHtml(str) {

  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


// ============================================================
// 起動
// ============================================================

spinBtn.addEventListener(
  "click",
  spinRoulette
);
