<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケボウリング｜条件ルーレット</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
  overflow-x: hidden;
}

.container {
  width: min(700px, 94%);
  margin: 0 auto;
  padding: 24px 0 50px;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 10px 0 24px;
}

.mode {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.mode button {
  flex: 1;
  padding: 14px;
  border: 1px solid #555;
  border-radius: 10px;
  background: #222;
  color: #aaa;
  font-size: 16px;
  font-weight: bold;
}

.mode button.active {
  background: #fff;
  color: #111;
}

button {
  cursor: pointer;
}

/* ============================================================
   ルーレット本体
   ============================================================ */

.roulette {
  min-height: 190px;
  border: 2px solid #444;
  border-radius: 18px;
  background: #181818;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  padding: 25px;
  margin-bottom: 18px;

  position: relative;
  overflow: hidden;

  transform-origin: center center;
}

/*
  回転中の外枠。
  animation は JS から .spinning を付けて発動。
*/

.roulette.spinning {
  animation:
    rouletteShake 0.11s infinite alternate,
    roulettePulse 0.8s infinite;
}

.roulette.spinning::before {
  content: "";
  position: absolute;
  inset: -30%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.10) 0%,
      rgba(255,255,255,0.03) 35%,
      transparent 70%
    );

  animation: rouletteGlow 0.45s infinite alternate;
  pointer-events: none;
}


/* ============================================================
   条件文字
   ============================================================ */

.condition {
  position: relative;
  z-index: 2;

  font-size: clamp(24px, 6vw, 42px);
  font-weight: bold;
  line-height: 1.35;

  transform-origin: center center;
}


/*
  回転中の文字。
  枠より少し激しく動かす。
*/

.condition.spinning {
  animation:
    conditionShake 0.075s infinite alternate,
    conditionScale 0.22s infinite alternate;
}


/*
  最終結果が決まった瞬間。
*/

.condition.result {
  animation: resultPop 0.55s cubic-bezier(.17,.89,.32,1.28);
}


/* ============================================================
   アニメーション
   ============================================================ */

@keyframes rouletteShake {

  0% {
    transform:
      translateX(-4px)
      rotate(-0.8deg);
  }

  100% {
    transform:
      translateX(4px)
      rotate(0.8deg);
  }

}

@keyframes roulettePulse {

  0% {
    box-shadow:
      0 0 0 rgba(255,255,255,0);
  }

  50% {
    box-shadow:
      0 0 25px rgba(255,255,255,0.08);
  }

  100% {
    box-shadow:
      0 0 0 rgba(255,255,255,0);
  }

}

@keyframes rouletteGlow {

  0% {
    transform: scale(0.9);
    opacity: .2;
  }

  100% {
    transform: scale(1.15);
    opacity: .65;
  }

}

@keyframes conditionShake {

  0% {
    transform:
      translate(
        -5px,
        1px
      )
      rotate(-1.2deg);
  }

  25% {
    transform:
      translate(
        4px,
        -1px
      )
      rotate(1deg);
  }

  50% {
    transform:
      translate(
        -3px,
        2px
      )
      rotate(-0.8deg);
  }

  75% {
    transform:
      translate(
        5px,
        -1px
      )
      rotate(1.1deg);
  }

  100% {
    transform:
      translate(
        -4px,
        0
      )
      rotate(-1deg);
  }

}

@keyframes conditionScale {

  0% {
    scale: 0.98;
  }

  100% {
    scale: 1.03;
  }

}

@keyframes resultPop {

  0% {
    transform:
      scale(0.65)
      rotate(-3deg);
    opacity: 0;
  }

  45% {
    transform:
      scale(1.16)
      rotate(1deg);
    opacity: 1;
  }

  70% {
    transform:
      scale(0.96)
      rotate(-0.4deg);
  }

  100% {
    transform:
      scale(1)
      rotate(0);
  }

}


/* ============================================================
   回転中のボタン
   ============================================================ */

.spin {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 20px;
  font-weight: bold;

  transition:
    transform .1s,
    opacity .2s;
}

.spin:active:not(:disabled) {
  transform: scale(.97);
}

.spin:disabled {
  opacity: .4;
  cursor: default;
}


/* ============================================================
   情報
   ============================================================ */

.info {
  margin-top: 18px;
  padding: 16px;
  background: #1b1b1b;
  border-radius: 12px;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.infoBox {
  text-align: center;
  background: #242424;
  border-radius: 10px;
  padding: 12px;
}

.infoLabel {
  font-size: 12px;
  color: #999;
}

.infoValue {
  margin-top: 5px;
  font-size: 22px;
  font-weight: bold;
}


/* ============================================================
   入力
   ============================================================ */

.inputs {
  margin-top: 20px;
}

.inputs label {
  display: block;
  margin-bottom: 6px;
  color: #aaa;
  font-size: 13px;
}

.inputs input {
  width: 100%;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #1c1c1c;
  color: #fff;
  font-size: 16px;
  margin-bottom: 12px;
}


/* ============================================================
   履歴
   ============================================================ */

.history {
  margin-top: 24px;
}

.history h2 {
  font-size: 17px;
  margin-bottom: 10px;
}

.historyItem {
  padding: 10px 12px;
  background: #1b1b1b;
  border-radius: 8px;
  margin-bottom: 7px;
  font-size: 14px;
}

.historyMeta {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

.subButtons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.subButtons button {
  flex: 1;
  padding: 11px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #222;
  color: #ccc;
}

a {
  color: inherit;
  text-decoration: none;
}


/* ============================================================
   アニメーションを抑える設定
   ============================================================ */

@media (prefers-reduced-motion: reduce) {

  .roulette.spinning,
  .condition.spinning,
  .roulette.spinning::before {
    animation: none;
  }

}
</style>
</head>

// ============================================================
// データ読み込み
// ============================================================

function loadConditions() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (!saved) {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(defaultConditions)
    );

    return structuredClone(
      defaultConditions
    );

  }

  try {

    return JSON.parse(saved);

  } catch (e) {

    console.error(
      "条件データ読み込みエラー",
      e
    );

    return structuredClone(
      defaultConditions
    );

  }

}

// 初期化

let currentMode =

let spinning =

      currentMode = "easy";

        .classList.add("active");

      document
        .getElementById("hardBtn")
        .classList.remove("active");

      difficultyEl.textContent =
        "EASY";

    }
  );


document
  .getElementById("hardBtn")
  .addEventListener(
    "click",
    () => {

      if (spinning) return;

      currentMode = "hard";

      document
        .getElementById("hardBtn")
        .classList.add("active");

      document
        .getElementById("easyBtn")
        .classList.remove("active");

      difficultyEl.textContent =
        "HARD";

    }
  );


// ============================================================
// ルーレット
// ============================================================

function spinRoulette() {

  if (spinning) return;


  const list =
    conditions[currentMode];


  if (
    !list ||
    list.length === 0
  ) {

    conditionEl.textContent =
      "条件がありません";

    return;

  }


  spinning = true;

  spinBtn.disabled = true;


  /*
    ここでアニメーション開始。
  */

  rouletteBox.classList.add(
    "spinning"
  );

  conditionEl.classList.remove(
    "result"
  );

  conditionEl.classList.add(
    "spinning"
  );


  let count = 0;


  /*
    22回固定ではなく、
    前半は速く、後半で減速。

    これによって
    「回り始める → 加速 → 減速 → 決定」
    という感じになる。
  */

  const maxCount = 30;


  function tick() {

    const random =
      list[
        Math.floor(
          Math.random() *
          list.length
        )
      ];


    conditionEl.textContent =
      random.text;


    count++;


    if (
      count >= maxCount
    ) {

      finishRoulette();

      return;

    }


    /*
      進行率。

      0   → 高速
      0.5 → 高速
      1   → ゆっくり
    */

    const progress =
      count / maxCount;


    /*
      後半ほど大きく減速。
    */

    const delay =
      35 +
      Math.pow(
        progress,
        3.2
      ) * 330;


    setTimeout(
      tick,
      delay
    );

  }


  tick();

}


// ============================================================
// 決定
// ============================================================

function finishRoulette() {

  const list =
    conditions[currentMode];


  const selected =
    list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];


  conditionEl.textContent =
    selected.text;


  multiplierEl.textContent =
    "×" +
    Number(
      selected.multiplier
    ).toFixed(1);


  /*
    回転アニメーション終了
  */

  rouletteBox.classList.remove(
    "spinning"
  );

  conditionEl.classList.remove(
    "spinning"
  );


  /*
    一度 reflow を起こしてから
    決定アニメーションを発火。
  */

  void conditionEl.offsetWidth;

  conditionEl.classList.add(
    "result"
  );


  /*
    少し遅らせて履歴追加。

    画面上で結果が決まった瞬間と
    履歴追加が完全に重ならないようにする。
  */

  addHistory(
    selected,
    currentMode
  );


  spinning = false;

  spinBtn.disabled = false;


  /*
    アニメーション用クラスを後で消す。
  */

  setTimeout(
    () => {

      conditionEl.classList.remove(
        "result"
      );

    },
    600
  );

}


// ============================================================
// 履歴
// ============================================================

function addHistory(
  condition,
  mode
) {

  const history =
    JSON.parse(
      localStorage.getItem(
        "karaokeBowlingHistory"
      ) || "[]"
    );


  history.unshift({

    text:
      condition.text,

    multiplier:
      condition.multiplier,

    mode:
      mode,

    category:
      condition.category,

    time:
      new Date().toLocaleTimeString(
        "ja-JP",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      )

  });


  localStorage.setItem(
    "karaokeBowlingHistory",
    JSON.stringify(history)
  );


  renderHistory();

}


// ============================================================
// 履歴表示
// ============================================================

function renderHistory() {

  const list =
    JSON.parse(
      localStorage.getItem(
        "karaokeBowlingHistory"
      ) || "[]"
    );


  const historyList =
    document.getElementById(
      "historyList"
    );


  historyList.innerHTML = "";


  list.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "historyItem";


      div.innerHTML = `

        <div>
          ${escapeHtml(item.text)}
          ×${Number(
            item.multiplier
          ).toFixed(1)}
        </div>

        <div class="historyMeta">

          ${item.mode.toUpperCase()}
          ／
          ${escapeHtml(
            item.category || ""
          )}
          ／
          ${item.time}

        </div>

      `;


      historyList.appendChild(
        div
      );

    }
  );

}


// ============================================================
// 履歴リセット
// ============================================================

document
  .getElementById(
    "resetHistoryBtn"
  )
  .addEventListener(
    "click",
    () => {

      if (
        confirm(
          "履歴をすべて削除しますか？"
        )
      ) {

        localStorage.removeItem(
          "karaokeBowlingHistory"
        );

        renderHistory();

      }

    }
  );


// ============================================================
// HTMLエスケープ
// ============================================================

function escapeHtml(str) {

  return String(str)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


// ============================================================
// 起動
// ============================================================

spinBtn.addEventListener(
  "click",
  spinRoulette
);


renderHistory();

</script>
