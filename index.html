<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAM採点OCRデモ</title>
  <!-- Tesseract.js (ブラウザ用OCRライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; }
    .container { max-width: 480px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    input[type="file"] { margin: 15px 0; width: 100%; }
    .result-card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #333; }
    .label { color: #888; font-size: 0.85em; }
    .value { font-size: 1.2em; font-weight: bold; color: #00ffcc; margin-bottom: 8px; }
    #status { color: #ffcc00; font-size: 0.9em; min-height: 1.2em; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎤 DAM採点 画面解析デモ</h2>
  <p>採点画面の写真を撮るか選択してください。</p>
  
  <input type="file" id="imageInput" accept="image/*">
  <div id="status"></div>

  <div class="result-card" id="result" style="display:none;">
    <div class="label">🎵 曲名</div>
    <div class="value" id="songTitle">-</div>

    <div class="label">🎤 アーティスト</div>
    <div class="value" id="artistName">-</div>

    <div class="label">🌟 素点</div>
    <div class="value" id="rawScore">- 点</div>

    <div class="label">📊 全国平均</div>
    <div class="value" id="avgScore">- 点</div>
  </div>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const status = document.getElementById('status');
  const resultDiv = document.getElementById('result');

  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    status.textContent = '🔍 画像を読み込み・解析中...（数秒かかります）';
    resultDiv.style.display = 'none';

    try {
      // 1. 日本語＋英語対応のOCRワーカーを作成
      const worker = await Tesseract.createWorker(['jpn', 'eng']);
      const ret = await worker.recognize(file);
      await worker.terminate();

      // 2. 抽出された生テキストを解析
      parseDamText(ret.data.text);
      status.textContent = '✅ 解析が完了しました！';
    } catch (err) {
      status.textContent = '❌ 解析に失敗しました。';
      console.error(err);
    }
  });

  function parseDamText(rawText) {
    console.log("OCR全テキスト:\n", rawText);

    // 点数パターン（例: 89.706 のような「2桁.3桁」の数字）を正規表現で全抽出
    const scoreMatches = rawText.match(/\d{2}\.\d{3}/g) || [];

    let rawScore = "未検出";
    let avgScore = "未検出";

    // DAM画面では最初に現れる大きい数字が素点、最後あたりが全国平均になる傾向を活用
    if (scoreMatches.length >= 2) {
      rawScore = scoreMatches[0];
      avgScore = scoreMatches[1];
    } else if (scoreMatches.length === 1) {
      rawScore = scoreMatches[0];
    }

    // 行ごとに分割して空行を除外
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    
    // 1〜2行目に曲名とアーティスト名が来やすいため割り当て
    const songTitle = lines[0] || "未検出";
    const artistName = lines[1] || "未検出";

    // 画面に表示
    document.getElementById('songTitle').textContent = songTitle;
    document.getElementById('artistName').textContent = artistName;
    document.getElementById('rawScore').textContent = rawScore;
    document.getElementById('avgScore').textContent = avgScore;

    resultDiv.style.display = 'block';
  }
</script>
</body>
</html>
