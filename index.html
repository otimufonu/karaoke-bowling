<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボウリング スコア＆ポイント管理</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); padding: 16px; color: #1e293b; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center; }

    /* 推定時間表示バッジ */
    .time-estimate {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* 拡大版 スコア入力エリア */
    .score-entry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .frame-box {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px;
      background: #f1f5f9;
      text-align: center;
    }
    .frame-label { font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 4px; }
    
    /* 入力欄を大きめに設定 */
    .score-input {
      width: 100%;
      height: 48px;
      font-size: 1.25rem;
      font-weight: bold;
      text-align: center;
      border: 2px solid #93c5fd;
      border-radius: 6px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s ease-in-out;
    }
    .score-input:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* データの羅列的・コンパクトな内訳表 */
    .breakdown-container { overflow-x: auto; }
    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem; /* 小さめフォント (12px) */
      line-height: 1.1;
    }
    .breakdown-table th, .breakdown-table td {
      border: 1px solid #94a3b8;
      padding: 2px 4px; /* マス目をギュッと縮小 */
      text-align: center;
      white-space: nowrap;
    }
    .breakdown-table th {
      background-color: #e2e8f0;
      color: #334155;
      font-weight: 700;
    }
    .breakdown-table tr:nth-child(even) { background-color: #f8fafc; }
    .breakdown-table td.num { font-family: monospace, monospace; }

    .summary-box {
      display: flex;
      gap: 16px;
      font-weight: bold;
      margin-top: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- スコア入力＆ステータス画面 -->
  <div class="card">
    <div class="card-title">
      <span>スコア入力</span>
      <!-- 推定総時間 (1フレーム4分換算) -->
      <div class="time-estimate" id="timeEstimate">
        ⏱️ 推定総時間: 0分 (0時間0分)
      </div>
    </div>

    <div class="score-entry-grid" id="scoreGrid">
      <!-- JavaScriptでフレーム入力欄を生成 -->
    </div>

    <div class="summary-box">
      <div>入力済フレーム数: <span id="completedFrames">0</span> / 10</div>
      <div>合計スコア: <span id="totalScore">0</span></div>
    </div>
  </div>

  <!-- 内訳表（ギュッと詰めたコンパクトレイアウト） -->
  <div class="card">
    <div class="card-title">詳細内訳データ</div>
    <div class="breakdown-container">
      <table class="breakdown-table">
        <thead>
          <tr>
            <th>Frame</th>
            <th>1st</th>
            <th>2nd</th>
            <th>3rd</th>
            <th>点数</th>
            <th>累計</th>
            <th>ポイント</th>
            <th>所要時間</th>
          </tr>
        </thead>
        <tbody id="breakdownBody">
          <!-- データの羅列として表示 -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const TOTAL_FRAMES = 10;
  const MINUTES_PER_FRAME = 4; // 1フレーム4分
  const scores = Array(TOTAL_FRAMES).fill('');

  function initApp() {
    const grid = document.getElementById('scoreGrid');
    grid.innerHTML = '';

    for (let i = 0; i < TOTAL_FRAMES; i++) {
      const box = document.createElement('div');
      box.className = 'frame-box';
      box.innerHTML = `
        <div class="frame-label">F${i + 1}</div>
        <input type="number" min="0" max="30" class="score-input" data-index="${i}" placeholder="-">
      `;
      grid.appendChild(box);
    }

    document.querySelectorAll('.score-input').forEach(input => {
      input.addEventListener('input', handleInput);
    });

    updateCalculations();
  }

  function handleInput(e) {
    const idx = parseInt(e.target.dataset.index, 10);
    scores[idx] = e.target.value === '' ? '' : Math.min(30, Math.max(0, parseInt(e.target.value, 10) || 0));
    updateCalculations();
  }

  function updateCalculations() {
    let currentTotal = 0;
    let filledCount = 0;
    const tbody = document.getElementById('breakdownBody');
    tbody.innerHTML = '';

    scores.forEach((val, i) => {
      const numVal = val !== '' ? Number(val) : 0;
      if (val !== '') filledCount++;
      currentTotal += numVal;

      const mins = (i + 1) * MINUTES_PER_FRAME;
      const pts = Math.floor(numVal * 1.2); // ポイント計算例

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="num">F${i + 1}</td>
        <td class="num">${val !== '' ? numVal : '-'}</td>
        <td class="num">-</td>
        <td class="num">-</td>
        <td class="num">${val !== '' ? numVal : 0}</td>
        <td class="num">${currentTotal}</td>
        <td class="num">${pts}pt</td>
        <td class="num">${mins}分</td>
      `;
      tbody.appendChild(tr);
    });

    // 1フレーム4分換算の推定総時間計算
    const totalMinutes = TOTAL_FRAMES * MINUTES_PER_FRAME;
    const hours = Math.floor(totalMinutes / 60);
    const remainingMins = totalMinutes % 60;
    
    document.getElementById('timeEstimate').innerText = 
      `⏱️ 推定総時間: ${totalMinutes}分 (${hours > 0 ? hours + '時間' : ''}${remainingMins}分)`;

    document.getElementById('completedFrames').innerText = filledCount;
    document.getElementById('totalScore').innerText = currentTotal;
  }

  window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
